[package]
name = "srcwranglr"
version = "0.5.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/jdefrancesco/SrcWranglr"

[dependencies]
eframe = { version = "0.37", features = ["persistence"] }
egui = "0.37"
gix = { version = "0.90.0", default-features = false, features = ["blame", "sha1", "parallel"] }
goblin = "0.10.7"
ignore = "0.4"
nucleo-matcher = "0.3.1"
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml_edit = "0.25.18"
tree-sitter = "0.27"
tree-sitter-cpp = "0.23"

[profile.release]
opt-level = 2

[dev-dependencies]
egui_kittest = "0.37"
tempfile = "3"
