<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- SrcWranglr app icon: a trail of breadcrumbs through a code graph.
       Laid out on the macOS icon grid (824px tile, 100px margin). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2D4371"/>
      <stop offset="1" stop-color="#0C1120"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#FF8F3F"/>
    </linearGradient>
    <linearGradient id="focus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#F0A53A"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="inside">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <!-- Tile and its shadow -->
  <rect x="100" y="118" width="824" height="824" rx="185" fill="#000" opacity="0.35" filter="url(#drop)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>

  <g clip-path="url(#inside)">
    <!-- Faint lines of source code -->
    <g fill="#FFFFFF" opacity="0.07">
      <rect x="180" y="190" width="250" height="24" rx="12"/>
      <rect x="230" y="236" width="330" height="24" rx="12"/>
      <rect x="230" y="282" width="210" height="24" rx="12"/>
      <rect x="280" y="328" width="290" height="24" rx="12"/>
      <rect x="180" y="420" width="190" height="24" rx="12"/>
      <rect x="180" y="604" width="150" height="24" rx="12"/>
      <rect x="580" y="650" width="260" height="24" rx="12"/>
      <rect x="630" y="696" width="190" height="24" rx="12"/>
      <rect x="580" y="834" width="230" height="24" rx="12"/>
    </g>

    <!-- Graph edges -->
    <g fill="none" stroke="#6FB4F5" stroke-width="10" stroke-linecap="round" opacity="0.55">
      <path d="M 320 712 C 320 620, 420 600, 470 572"/>
      <path d="M 690 520 C 760 480, 760 420, 720 356"/>
      <path d="M 580 588 C 640 680, 700 740, 760 770"/>
    </g>

    <!-- The trail: breadcrumbs from the start node through the focus -->
    <g filter="url(#glow)">
      <path d="M 300 688 C 300 610, 400 590, 470 560 M 680 510 C 760 470, 770 410, 715 352"
            fill="none" stroke="url(#trail)" stroke-width="30" stroke-linecap="round"
            stroke-dasharray="0.1 52"/>
    </g>

    <!-- Nodes: symbols as pills -->
    <g stroke="#6FB4F5" stroke-width="10" fill="#16213A">
      <rect x="196" y="712" width="210" height="100" rx="50"/>
      <rect x="600" y="252" width="230" height="100" rx="50"/>
      <rect x="704" y="740" width="150" height="80" rx="40" opacity="0.8"/>
    </g>
    <g fill="#6FB4F5" opacity="0.9">
      <rect x="246" y="750" width="110" height="24" rx="12"/>
      <rect x="650" y="290" width="130" height="24" rx="12"/>
      <rect x="744" y="769" width="70" height="22" rx="11" opacity="0.8"/>
    </g>

    <!-- The focused symbol -->
    <rect x="440" y="488" width="270" height="116" rx="58" fill="url(#focus)" filter="url(#glow)"/>
    <rect x="496" y="533" width="158" height="26" rx="13" fill="#3B2A08" opacity="0.85"/>
  </g>

  <!-- Edge highlight -->
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="3"/>
</svg>
